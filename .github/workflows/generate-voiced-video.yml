name: Generate voiced website demo

on:
  push:
    branches: [main]
    paths:
      - video-narration.txt
      - .github/workflows/generate-voiced-video.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mandarin voice generator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install edge-tts
      - name: Generate Mandarin narration
        run: |
          mkdir -p voice-work
          python3 - <<'PY'
          from pathlib import Path
          import asyncio, edge_tts
          lines = [line.strip() for line in Path('video-narration.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          async def main():
              for index, text in enumerate(lines, 1):
                  await edge_tts.Communicate(text, 'zh-CN-XiaoxiaoNeural', rate='+0%', pitch='-2Hz').save(f'voice-work/{index}.mp3')
          asyncio.run(main())
          PY
      - name: Fit complete sentences into their scenes
        run: |
          python3 - <<'PY'
          import subprocess
          targets = [22, 21, 23, 29, 25, 40.24]
          for index, target in enumerate(targets, 1):
              source = f'voice-work/{index}.mp3'
              duration = float(subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                  '-of', 'default=noprint_wrappers=1:nokey=1', source
              ], text=True).strip())
              speed = max(1.0, duration / target)
              audio_filter = f'atempo={speed:.6f},apad,atrim=0:{target}'
              subprocess.run([
                  'ffmpeg', '-y', '-loglevel', 'error', '-i', source,
                  '-af', audio_filter, '-ar', '48000', '-ac', '2',
                  f'voice-work/fitted-{index}.wav'
              ], check=True)
              print(f'segment {index}: {duration:.2f}s -> {target:.2f}s, speed {speed:.3f}x')
          PY
      - name: Mix narration into the published video
        run: |
          ffmpeg -y -loglevel error -i xijing-website-demo.mp4 \
            -i voice-work/fitted-1.wav -i voice-work/fitted-2.wav -i voice-work/fitted-3.wav \
            -i voice-work/fitted-4.wav -i voice-work/fitted-5.wav -i voice-work/fitted-6.wav \
            -filter_complex "[1:a][2:a][3:a][4:a][5:a][6:a]concat=n=6:v=0:a=1,loudnorm=I=-16:TP=-1.5:LRA=9[out]" \
            -map 0:v:0 -map "[out]" -c:v copy -c:a aac -b:a 192k -movflags +faststart voiced.mp4
          mv voiced.mp4 xijing-website-demo.mp4
      - name: Commit voiced video
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add xijing-website-demo.mp4
          git commit -m "Add Mandarin narration to website demo video"
          git push
